name: Windows source build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Build without Git repository metadata (like a source ZIP)
        run: |
          rm -rf .git
          mingw32-make
          test -f MythicalDangers.exe
          test -f sfml-graphics-2.dll
          test -f sfml-audio-2.dll
          test -f openal32.dll
          test -f libstdc++-6.dll
          test -f libgcc_s_seh-1.dll
          test -f libwinpthread-1.dll
